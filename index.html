<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>VocabMaster</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      transition: background 0.4s ease;
    }

    body.correct-bg {
      background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
    }

    body.incorrect-bg {
      background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #333;
      font-size: 1.8em;
      margin-bottom: 10px;
      text-align: center;
    }

    h2 {
      color: #555;
      font-size: 1.4em;
      margin-bottom: 20px;
      text-align: center;
    }

    h3 {
      color: #666;
      font-size: 1.1em;
      margin-bottom: 15px;
      text-align: center;
    }

    button {
      font-size: 1em;
      cursor: pointer;
      padding: 12px 24px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background-color: #667eea;
      color: white;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    button:hover {
      background-color: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .hidden {
      display: none;
    }

    .word {
      font-size: 2.2em;
      margin: 30px 0;
      color: #333;
      font-weight: bold;
      text-align: center;
    }

    .section-list {
      text-align: left;
      margin: 20px 0;
      max-height: 400px;
      overflow-y: auto;
    }

    .section-item {
      margin: 12px 0;
      font-size: 1.1em;
    }

    .section-item label {
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 10px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .section-item label:hover {
      background-color: #f0f0f0;
    }

    .section-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
    }

    .menu {
      text-align: center;
    }

    .question {
      font-size: 2em;
      margin: 20px 0;
      color: #333;
      font-weight: bold;
      text-align: center;
    }

    .score {
      text-align: center;
      font-size: 1.2em;
      margin-bottom: 20px;
      color: #555;
      font-weight: 500;
    }

    .choices {
      margin: 20px 0;
    }

    .choices button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
      font-size: 1.05em;
      text-align: left;
    }

    .choices button:hover {
      background-color: #e9ecef;
    }

    .choices button.correct-answer {
      background-color: #ffd700;
      color: #333;
    }

    .choices button:disabled {
      cursor: default;
    }

    .answer-feedback {
      text-align: center;
      font-size: 1.2em;
      margin: 20px 0;
      font-weight: bold;
      min-height: 30px;
    }

    .button-group {
      text-align: center;
      margin-top: 20px;
    }

    .checkbox-container {
      text-align: center;
      margin: 20px 0;
      font-size: 1.1em;
    }

    .checkbox-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      vertical-align: middle;
      cursor: pointer;
    }

    /* ── おさらいモードボタン ── */
    .btn-review {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      position: relative;
    }
    .btn-review:hover {
      background: linear-gradient(135deg, #d97fe0 0%, #d84560 100%);
      box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
    }
    .review-badge {
      display: inline-block;
      background: #fff;
      color: #f5576c;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 700;
      padding: 2px 8px;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* ── おさらい確認画面：単語リスト ── */
    .review-word-list {
      margin: 16px 0;
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .review-word-card {
      background: linear-gradient(135deg, #fdf4ff 0%, #fce4ec 100%);
      border: 1.5px solid #f8bbd0;
      border-left: 4px solid #f5576c;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.98em;
    }

    .review-word-card-en {
      font-weight: 700;
      color: #b71c1c;
    }

    .review-word-card-ja {
      color: #555;
      text-align: right;
    }

    .review-clear-btn {
      background: #ff6b6b !important;
    }
    .review-clear-btn:hover {
      background: #ee5a52 !important;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4) !important;
    }

    /* ── 問題方向セレクター ── */
    .direction-selector {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .direction-btn {
      padding: 10px 18px;
      border: 2px solid #ccc;
      border-radius: 24px;
      background: #f5f5f5;
      color: #666;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 4px;
    }

    .direction-btn:hover {
      border-color: #667eea;
      background: #eef0fd;
      color: #667eea;
      transform: translateY(-1px);
      box-shadow: none;
    }

    .direction-btn.selected {
      border-color: #667eea;
      background: #667eea;
      color: white;
      box-shadow: 0 3px 10px rgba(102, 126, 234, 0.35);
    }

    .practice-settings-section {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 12px 0;
    }

    .practice-settings-label {
      font-size: 0.9em;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      text-align: center;
    }

    /* ── 結果画面：不正解カード ── */
    .result-section {
      margin-top: 28px;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .result-header-icon {
      font-size: 1.4em;
    }

    .result-title {
      font-size: 1.15em;
      font-weight: 700;
      color: #c62828;
    }

    .result-count-badge {
      background: #c62828;
      color: white;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.85em;
      font-weight: 700;
    }

    .incorrect-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .incorrect-card {
      background: linear-gradient(135deg, #fff5f5 0%, #fff0f0 100%);
      border: 1.5px solid #ffcdd2;
      border-left: 4px solid #e53935;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease forwards;
      opacity: 0;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .incorrect-card-word {
      font-size: 1.05em;
      font-weight: 700;
      color: #c62828;
    }

    .incorrect-card-meaning {
      font-size: 1em;
      color: #555;
      text-align: right;
    }

    .incorrect-card-divider {
      color: #ccc;
      font-size: 1.1em;
    }

    /* ── スコアサマリーカード ── */
    .score-summary {
      background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
      border: 1.5px solid #a5d6a7;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin: 20px 0 0;
    }

    .score-summary.score-bad {
      background: linear-gradient(135deg, #fff3e0, #fff8e1);
      border-color: #ffcc80;
    }

    .score-summary-label {
      font-size: 0.95em;
      color: #777;
      margin-bottom: 6px;
    }

    .score-summary-value {
      font-size: 2.2em;
      font-weight: 800;
      color: #2e7d32;
    }

    .score-summary.score-bad .score-summary-value {
      color: #e65100;
    }

    .score-summary-sub {
      font-size: 0.9em;
      color: #888;
      margin-top: 4px;
    }

    /* ── おさらいモード：空の状態 ── */
    .empty-state {
      text-align: center;
      padding: 30px 0;
      color: #aaa;
    }

    .empty-state-icon {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .empty-state-text {
      font-size: 1em;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 15px;
      }
      h1 { font-size: 1.5em; }
      h2 { font-size: 1.2em; }
      .word, .question { font-size: 1.6em; }
      button { padding: 10px 20px; font-size: 0.95em; }
      .section-list { max-height: 1200px; }
      .incorrect-card { flex-direction: column; align-items: flex-start; gap: 4px; }
      .incorrect-card-meaning { text-align: left; }
    }
  </style>
  <script src="words.js"></script>
</head>
<body>

  <!-- モード選択画面 -->
  <div id="modeMenu" class="container">
    <h1>英単語学習</h1>
    <h2>モードを選択してください</h2>
    <div class="menu">
      <button onclick="chooseMode('memorize')">暗記モード</button>
      <button onclick="chooseMode('practice')">実践モード</button>
      <br>
      <button class="btn-review" onclick="chooseMode('review')">
        おさらいモード
        <span class="review-badge" id="reviewBadge">0</span>
      </button>
    </div>
  </div>

  <!-- レベル選択画面 -->
  <div id="levelMenu" class="container hidden">
    <h2 id="levelModeTitle"></h2>
    <h3>レベルを選択してください</h3>
    <div class="menu">
      <button onclick="chooseLevel(1)">Level 1</button>
      <button onclick="chooseLevel(2)">Level 2</button><br>
      <button onclick="chooseLevel(3)">Level 3</button>
      <button onclick="chooseLevel(4)">Level 4</button><br>
      <button onclick="chooseLevel(5)">Level 5</button>
      <button onclick="chooseLevel(6)">Level 6</button>
    </div>
    <div class="button-group">
      <button onclick="backToModeMenu()">モード選択に戻る</button>
    </div>
  </div>

  <!-- セクション選択画面 -->
  <div id="sectionMenu" class="container hidden">
    <div class="button-group">
      <button onclick="backToLevelMenu()">レベル選択に戻る</button>
      <button onclick="clearAllSelections()">選択を全削除</button>
      <button onclick="selectAllSections()">すべて選択</button>
    </div>
    <h2 id="selectedModeTitle"></h2>
    <h3>セクションを選択してください（複数可）</h3>
    <div id="sectionList"></div>
    <div class="button-group">
      <button onclick="startSelectedMode()">スタート</button>
    </div>
  </div>

  <!-- 暗記モード画面 -->
  <div id="memorizeMenu" class="container hidden">
    <h2>暗記モード</h2>
    <div class="word" id="memorizeWord"></div>
    <div class="button-group">
      <button id="backButton" onclick="backMemorize()">前へ</button>
      <button id="nextButton" onclick="nextMemorize()">次へ</button>
      <br>
      <button onclick="backToSectionMenu()">セクション選択に戻る</button>
    </div>
  </div>

  <!-- おさらいモード確認画面 -->
  <div id="reviewConfirmMenu" class="container hidden">
    <h2>おさらいモード</h2>
    <h3>📚 保存された間違い単語</h3>
    <div class="review-word-list" id="reviewWordList"></div>
    <div class="button-group">
      <button class="btn-review" onclick="startReviewPractice()">おさらいスタート</button>
      <br>
      <button class="review-clear-btn" onclick="clearReviewWords()">リストをクリア</button>
      <br>
      <button onclick="backToModeMenu()">モード選択に戻る</button>
    </div>
  </div>

  <!-- 実践モード設定画面 -->
  <div id="practiceMenu" class="container hidden">
    <h2 id="practiceMenuTitle">実践モード設定</h2>

    <div class="practice-settings-section">
      <div class="practice-settings-label">問題の方向</div>
      <div class="direction-selector">
        <button class="direction-btn" id="dirBtn-word"    onclick="setDirection('word')">英語 → 日本語</button>
        <button class="direction-btn" id="dirBtn-meaning" onclick="setDirection('meaning')">日本語 → 英語</button>
        <button class="direction-btn selected" id="dirBtn-both" onclick="setDirection('both')">両方</button>
      </div>
    </div>

    <div class="practice-settings-section">
      <div class="practice-settings-label">順番</div>
      <div class="checkbox-container" style="margin:8px 0">
        <label>
          <input type="checkbox" id="shuffleOption">
          シャッフルする
        </label>
      </div>
    </div>

    <div class="button-group">
      <button onclick="startPractice()">スタート</button>
      <br>
      <button id="practiceMenuBackBtn" onclick="backFromPracticeMenu()">セクション選択に戻る</button>
    </div>
  </div>

  <!-- 実践問題画面 -->
  <div id="practiceQuestion" class="container hidden">
    <div class="question" id="questionWord"></div>
    <div class="score">正解数: <span id="correctCount">0</span>問<br><span id="currentQuestionIndex">0</span> / <span id="totalCount">0</span></div>
    <div class="choices" id="choices"></div>
    <div class="answer-feedback" id="answerFeedback"></div>

    <!-- スコアサマリー（結果時のみ表示） -->
    <div id="scoreSummary" class="hidden"></div>

    <!-- 不正解カード（結果時のみ表示） -->
    <div id="incorrectSection" class="result-section hidden"></div>

    <div class="button-group">
      <button id="nextQuestion" onclick="nextQuestion()">次へ</button>
      <br>
      <button id="backFromQuestionBtn" onclick="backFromQuestion()">メニューに戻る</button>
    </div>
  </div>

<script>
  // ─────────────────────────────────────────
  //  永続ストレージ（localStorage）
  // ─────────────────────────────────────────
  const STORAGE_KEY = 'vocabmaster_incorrect_words';

  function loadIncorrectWords() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return [];
    }
  }

  function saveIncorrectWords(list) {
    try {
      // word+meaningで重複排除
      const unique = [];
      const seen = new Set();
      list.forEach(w => {
        const key = w.word + '||' + w.meaning;
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(w);
        }
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(unique));
      updateReviewBadge();
      return unique;
    } catch (e) {
      return list;
    }
  }

  function updateReviewBadge() {
    const list = loadIncorrectWords();
    document.getElementById('reviewBadge').textContent = list.length;
  }

  // ─────────────────────────────────────────
  //  状態変数
  // ─────────────────────────────────────────
  let selectedMode = '';
  let selectedLevel = 0;
  let selectedSections = [];
  let filteredWords = [];
  let memorizeIndex = 0;
  let memorizeStage = 'word';
  let correctCount = 0;
  let totalCount = 0;
  let levelSections = [];
  let sectionSelections = {};
  let sub_incorrectWords = []; // 今回のセッションで間違えた単語
  let isReviewMode = false;    // おさらいモードフラグ
  let questionDirection = 'both'; // 'word' | 'meaning' | 'both'

  // ─────────────────────────────────────────
  //  問題方向セレクター
  // ─────────────────────────────────────────
  function setDirection(dir) {
    questionDirection = dir;
    ['word', 'meaning', 'both'].forEach(d => {
      document.getElementById(`dirBtn-${d}`).classList.toggle('selected', d === dir);
    });
  }

  // ─────────────────────────────────────────
  //  レベル・セクション
  // ─────────────────────────────────────────
  function getLevelSections(level) {
    const ranges = {
      1: [1, 3], 2: [4, 6], 3: [7, 9], 4: [10, 12],
      5: [13, 15], 6: [16, 18], 7: [19, 21], 8: [22, 24],
      9: [25, 27], 10: [28, 30], 11: [31, 33], 12: [34, 36],
      13: [37, 39], 14: [40, 42], 15: [43, 45], 16: [46, 48],
      17: [49, 51], 18: [52, 54], 19: [55, 57]
    };
    const [start, end] = ranges[level];
    const sections = [];
    for (let sec in sectionNames) {
      const secNum = parseInt(sec);
      if (secNum >= start && secNum <= end) sections.push(secNum);
    }
    return sections.sort((a, b) => a - b);
  }

  function getSectionPage(sectionNum) {
    const sectionWord = words.find(w => w.section === sectionNum);
    return sectionWord ? sectionWord.page : '';
  }

  function generate_SectionList() {
    const sectionList = document.getElementById('sectionList');
    sectionList.innerHTML = '';
    levelSections.forEach(sec => {
      const div = document.createElement('div');
      div.className = 'section-item';
      const checked = sectionSelections[sec] ? 'checked' : '';
      const pageNum = getSectionPage(sec);
      const pageText = pageNum ? ` (p${pageNum})` : '';
      div.innerHTML = `<label><input type="checkbox" value="${sec}" ${checked}> ${sectionNames[sec]}${pageText}</label>`;
      sectionList.appendChild(div);
    });
    document.querySelectorAll('#sectionList input[type="checkbox"]').forEach(input => {
      input.addEventListener('change', (e) => {
        const sec = parseInt(e.target.value);
        sectionSelections[sec] = e.target.checked;
      });
    });
  }

  // ─────────────────────────────────────────
  //  画面遷移
  // ─────────────────────────────────────────
  function chooseMode(mode) {
    selectedMode = mode;
    isReviewMode = (mode === 'review');

    if (isReviewMode) {
      const savedWords = loadIncorrectWords();
      if (savedWords.length === 0) {
        alert('おさらいする単語がありません。\n実践モードで問題を解いて間違えた単語を貯めましょう！');
        return;
      }
      filteredWords = savedWords;
      document.getElementById('modeMenu').classList.add('hidden');
      showReviewConfirm(savedWords);
      return;
    }

    document.getElementById('modeMenu').classList.add('hidden');
    document.getElementById('levelMenu').classList.remove('hidden');
    document.getElementById('levelModeTitle').textContent =
      mode === 'memorize' ? '暗記モード - レベル選択' : '実践モード - レベル選択';
  }

  // おさらい確認画面を表示
  function showReviewConfirm(savedWords) {
    const listEl = document.getElementById('reviewWordList');
    listEl.innerHTML = '';
    savedWords.forEach(w => {
      const card = document.createElement('div');
      card.className = 'review-word-card';
      card.innerHTML = `
        <span class="review-word-card-en">${w.word}</span>
        <span style="color:#ccc">→</span>
        <span class="review-word-card-ja">${w.meaning}</span>
      `;
      listEl.appendChild(card);
    });
    document.getElementById('reviewConfirmMenu').classList.remove('hidden');
  }

  // おさらいスタート（確認画面→設定画面）
  function startReviewPractice() {
    document.getElementById('reviewConfirmMenu').classList.add('hidden');
    document.getElementById('practiceMenuTitle').textContent = 'おさらいモード設定';
    document.getElementById('practiceMenuBackBtn').textContent = 'おさらい確認に戻る';
    document.getElementById('practiceMenu').classList.remove('hidden');
  }

  // リストをクリア
  function clearReviewWords() {
    if (!confirm('保存された間違い単語をすべて削除しますか？')) return;
    saveIncorrectWords([]);
    document.getElementById('reviewConfirmMenu').classList.add('hidden');
    document.getElementById('modeMenu').classList.remove('hidden');
    updateReviewBadge();
  }

  function chooseLevel(level) {
    selectedLevel = level;
    levelSections = getLevelSections(level);
    document.getElementById('levelMenu').classList.add('hidden');
    document.getElementById('sectionMenu').classList.remove('hidden');
    document.getElementById('selectedModeTitle').textContent =
      selectedMode === 'memorize'
        ? `暗記モード - Level ${level} セクション選択`
        : `実践モード - Level ${level} セクション選択`;
    generate_SectionList();
  }

  function clearAllSelections() {
    sectionSelections = {};
    generate_SectionList();
  }

  function selectAllSections() {
    sectionSelections = {};
    levelSections.forEach(sec => { sectionSelections[sec] = true; });
    generate_SectionList();
  }

  function backToModeMenu() {
    document.getElementById('modeMenu').classList.remove('hidden');
    ['levelMenu','sectionMenu','memorizeMenu','practiceMenu','practiceQuestion','reviewConfirmMenu'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
    sectionSelections = {};
    document.body.className = '';
    updateReviewBadge();
  }

  function backToLevelMenu() {
    document.getElementById('levelMenu').classList.remove('hidden');
    document.getElementById('sectionMenu').classList.add('hidden');
    sectionSelections = {};
  }

  function backToSectionMenu() {
    ['memorizeMenu','practiceMenu','practiceQuestion'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
    document.getElementById('sectionMenu').classList.remove('hidden');
    memorizeIndex = 0;
    memorizeStage = 'word';
    generate_SectionList();
    document.body.className = '';
  }

  // 実践モード設定画面からの「戻る」
  function backFromPracticeMenu() {
    document.getElementById('practiceMenu').classList.add('hidden');
    if (isReviewMode) {
      // おさらいモード設定→確認画面へ戻る
      document.getElementById('practiceMenuTitle').textContent = '実践モード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'セクション選択に戻る';
      const savedWords = loadIncorrectWords();
      showReviewConfirm(savedWords);
    } else {
      document.getElementById('sectionMenu').classList.remove('hidden');
    }
  }

  // 問題画面からの「メニューに戻る」
  function backFromQuestion() {
    document.getElementById('practiceQuestion').classList.add('hidden');
    if (isReviewMode) {
      document.getElementById('practiceMenuTitle').textContent = 'おさらいモード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'おさらい確認に戻る';
      document.getElementById('practiceMenu').classList.remove('hidden');
    } else {
      document.getElementById('practiceMenuTitle').textContent = '実践モード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'セクション選択に戻る';
      document.getElementById('practiceMenu').classList.remove('hidden');
    }
    document.body.className = '';
  }

  function getSelectedSections() {
    return Object.keys(sectionSelections)
      .filter(sec => sectionSelections[sec])
      .map(sec => parseInt(sec));
  }

  function startSelectedMode() {
    selectedSections = getSelectedSections();
    if (selectedSections.length === 0) {
      alert('セクションを選択してください');
      return;
    }
    filteredWords = words.filter(w => selectedSections.includes(w.section));
    if (selectedMode === 'memorize') {
      startMemorize();
    } else {
      document.getElementById('sectionMenu').classList.add('hidden');
      document.getElementById('practiceMenuTitle').textContent = '実践モード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'セクション選択に戻る';
      document.getElementById('practiceMenu').classList.remove('hidden');
    }
  }

  // ─────────────────────────────────────────
  //  暗記モード
  // ─────────────────────────────────────────
  function startMemorize() {
    document.getElementById('sectionMenu').classList.add('hidden');
    document.getElementById('memorizeMenu').classList.remove('hidden');
    memorizeIndex = 0;
    memorizeStage = 'word';
    document.getElementById('nextButton').disabled = false;
    showMemorize();
  }

  function showMemorize() {
    if (memorizeIndex >= filteredWords.length) {
      document.getElementById('memorizeWord').innerHTML = 'お疲れさまでした！';
      document.getElementById('nextButton').disabled = true;
      return;
    }
    document.getElementById('nextButton').disabled = false;
    const current = filteredWords[memorizeIndex];
    document.getElementById('memorizeWord').innerHTML =
      memorizeStage === 'word' ? current.word : current.meaning;
  }

  function nextMemorize() {
    if (memorizeStage === 'word') {
      memorizeStage = 'meaning';
    } else {
      memorizeStage = 'word';
      memorizeIndex++;
    }
    showMemorize();
  }

  function backMemorize() {
    if (memorizeStage === 'meaning') {
      memorizeStage = 'word';
    } else if (memorizeIndex > 0) {
      memorizeIndex--;
      memorizeStage = 'meaning';
    }
    showMemorize();
  }

  // ─────────────────────────────────────────
  //  実践 / おさらいモード
  // ─────────────────────────────────────────
  let practiceWords = [];
  let currentQuestionIndex = 0;
  let currentCorrectAnswer = '';
  let currentQuestionType = 'word';

  function startPractice() {
    // ★ バグ修正：毎回スタート時にリセット
    sub_incorrectWords = [];

    const shuffle = document.getElementById('shuffleOption').checked;

    practiceWords = [];

    // 方向設定に応じて問題を追加
    if (questionDirection === 'word' || questionDirection === 'both') {
      filteredWords.forEach(word => {
        practiceWords.push({ ...word, questionType: 'word' });
      });
    }
    if (questionDirection === 'meaning' || questionDirection === 'both') {
      filteredWords.forEach(word => {
        practiceWords.push({ ...word, questionType: 'meaning' });
      });
    }

    if (shuffle) {
      practiceWords.sort(() => Math.random() - 0.5);
    }

    currentQuestionIndex = 0;
    document.getElementById('practiceMenu').classList.add('hidden');
    document.getElementById('practiceQuestion').classList.remove('hidden');
    document.getElementById('scoreSummary').classList.add('hidden');
    document.getElementById('incorrectSection').classList.add('hidden');
    setAnswerFeedback('', false);
    correctCount = 0;
    totalCount = practiceWords.length;
    document.getElementById('correctCount').textContent = correctCount;
    document.getElementById('totalCount').textContent = totalCount;
    document.getElementById('nextQuestion').disabled = true;
    document.getElementById('currentQuestionIndex').textContent = currentQuestionIndex + 1;
    showPracticeQuestion();
  }

  function setAnswerFeedback(message, isCorrect) {
    const feedbackDiv = document.getElementById('answerFeedback');
    feedbackDiv.textContent = message;
    feedbackDiv.style.color = isCorrect ? '#2d6a2d' : '#c62828';
  }

  function showPracticeQuestion() {
    if (currentQuestionIndex >= practiceWords.length) {
      // ── 全問終了 ──
      document.getElementById('questionWord').innerHTML = '全問終了！';
      document.getElementById('choices').innerHTML = '';
      setAnswerFeedback('', false);
      document.getElementById('nextQuestion').disabled = true;

      // スコアサマリー
      const pct = Math.round((correctCount / totalCount) * 100);
      const isGood = pct >= 70;
      const summaryEl = document.getElementById('scoreSummary');
      summaryEl.className = isGood ? 'score-summary' : 'score-summary score-bad';
      summaryEl.innerHTML = `
        <div class="score-summary-label">最終スコア</div>
        <div class="score-summary-value">${correctCount} <span style="font-size:0.55em;font-weight:500">/ ${totalCount}</span></div>
        <div class="score-summary-sub">正答率 ${pct}%</div>
      `;
      summaryEl.classList.remove('hidden');

      // 不正解カード
      if (sub_incorrectWords.length > 0) {
        // localStorage に保存（おさらいモードの時は上書き更新）
        const existing = isReviewMode ? [] : loadIncorrectWords();
        saveIncorrectWords(existing.concat(sub_incorrectWords));

        const sectionEl = document.getElementById('incorrectSection');
        sectionEl.innerHTML = `
          <div class="result-header">
            <span class="result-header-icon">📝</span>
            <span class="result-title">間違えた単語</span>
            <span class="result-count-badge">${sub_incorrectWords.length}語</span>
          </div>
          <div class="incorrect-cards" id="incorrectCardList"></div>
        `;
        sectionEl.classList.remove('hidden');

        const cardList = document.getElementById('incorrectCardList');
        sub_incorrectWords.forEach((w, i) => {
          const card = document.createElement('div');
          card.className = 'incorrect-card';
          card.style.animationDelay = `${i * 60}ms`;
          card.innerHTML = `
            <span class="incorrect-card-word">${w.word}</span>
            <span class="incorrect-card-divider">→</span>
            <span class="incorrect-card-meaning">${w.meaning}</span>
          `;
          cardList.appendChild(card);
        });
      } else {
        // 全問正解：おさらいモードなら消す
        if (isReviewMode) {
          saveIncorrectWords([]);
        }
        const sectionEl = document.getElementById('incorrectSection');
        sectionEl.innerHTML = `
          <div class="result-header">
            <span class="result-header-icon">🎉</span>
            <span class="result-title" style="color:#2e7d32">全問正解！素晴らしい！</span>
          </div>
        `;
        sectionEl.classList.remove('hidden');
      }
      return;
    }

    const current = practiceWords[currentQuestionIndex];
    currentQuestionType = current.questionType;

    let questionText, correctAnswer, allChoices;
    if (currentQuestionType === 'word') {
      questionText = current.word;
      correctAnswer = current.meaning;
      allChoices = words.map(w => w.meaning);
    } else {
      questionText = current.meaning;
      correctAnswer = current.word;
      allChoices = words.map(w => w.word);
    }

    currentCorrectAnswer = correctAnswer;
    document.getElementById('questionWord').innerHTML = questionText;

    let options = [correctAnswer];
    while (options.length < 4) {
      let rand = allChoices[Math.floor(Math.random() * allChoices.length)];
      if (!options.includes(rand)) options.push(rand);
    }
    options.sort(() => Math.random() - 0.5);

    const choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.textContent = opt;
      btn.onclick = () => {
        Array.from(choicesDiv.children).forEach(b => b.disabled = true);
        Array.from(choicesDiv.children).forEach(b => {
          if (b.textContent === correctAnswer) b.classList.add('correct-answer');
        });

        if (opt === correctAnswer) {
          setAnswerFeedback('正解！', true);
          document.body.className = 'correct-bg';
          correctCount++;
          document.getElementById('correctCount').textContent = correctCount;
        } else {
          setAnswerFeedback(`不正解！正解は：${correctAnswer}`, false);
          sub_incorrectWords.push(current);
          document.body.className = 'incorrect-bg';
        }
        document.getElementById('nextQuestion').disabled = false;
      };
      choicesDiv.appendChild(btn);
    });
  }

  function nextQuestion() {
    document.body.className = '';
    currentQuestionIndex++;
    showPracticeQuestion();
    setAnswerFeedback('', false);
    document.getElementById('nextQuestion').disabled = true;
    if (currentQuestionIndex < totalCount) {
      document.getElementById('currentQuestionIndex').textContent = currentQuestionIndex + 1;
    }
  }

  // ─────────────────────────────────────────
  //  初期化
  // ─────────────────────────────────────────
  updateReviewBadge();
</script>

</body>
</html>
