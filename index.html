<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>VocabMaster</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      transition: background 0.4s ease;
    }
    body.correct-bg   { background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%); }
    body.incorrect-bg { background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%); }

    .container {
      max-width: 600px; margin: 0 auto; background: white;
      border-radius: 16px; padding: 30px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,.2);
    }
    h1 { color:#333; font-size:1.8em; margin-bottom:10px; text-align:center; }
    h2 { color:#555; font-size:1.4em; margin-bottom:20px; text-align:center; }
    h3 { color:#666; font-size:1.1em; margin-bottom:15px; text-align:center; }

    button {
      font-size:1em; cursor:pointer; padding:12px 24px; margin:8px;
      border:none; border-radius:8px; background-color:#667eea; color:white;
      transition:all .3s ease; font-weight:500;
    }
    button:hover { background-color:#5568d3; transform:translateY(-2px); box-shadow:0 4px 12px rgba(102,126,234,.4); }
    button:active { transform:translateY(0); }
    button:disabled { background-color:#ccc; cursor:not-allowed; transform:none; box-shadow:none; }
    .redButton { border-radius:8px; background-color:#fa8072; color:white; transition:all .3s ease; font-weight:500; }
    .redButton:hover {background-color:#f15341; transform:translateY(-2px); box-shadow:0 4px 12px rgba(241,83,65,.4); }
    
    .hidden { display:none; }
    .word { font-size:2.2em; margin:30px 0; color:#333; font-weight:bold; text-align:center; }

    .section-list { text-align:left; margin:20px 0; max-height:400px; overflow-y:auto; }
    .section-item { margin:12px 0; font-size:1.1em; }
    .section-item label { display:flex; align-items:center; cursor:pointer; padding:10px; border-radius:8px; transition:background-color .2s ease; }
    .section-item label:hover { background-color:#f0f0f0; }
    .section-item input[type="checkbox"] { width:20px; height:20px; margin-right:12px; cursor:pointer; }

    .menu { text-align:center; }
    .question { font-size:2em; margin:20px 0; color:#333; font-weight:bold; text-align:center; }
    .score { text-align:center; font-size:1.2em; margin-bottom:20px; color:#555; font-weight:500; }

    .choices { margin:20px 0; }
    .choices button { display:block; width:100%; margin:10px 0; padding:15px; background-color:#f8f9fa; color:#333; font-size:1.05em; text-align:left; }
    .choices button:hover { background-color:#e9ecef; }
    .choices button.correct-answer { background-color:#ffd700; color:#333; }
    .choices button:disabled { cursor:default; }

    .answer-feedback { text-align:center; font-size:1.2em; margin:20px 0; font-weight:bold; min-height:30px; }
    .button-group { text-align:center; margin-top:20px; }
    .checkbox-container { text-align:center; margin:20px 0; font-size:1.1em; }
    .checkbox-container input[type="checkbox"] { width:18px; height:18px; margin-right:8px; vertical-align:middle; cursor:pointer; }

    /* おさらいボタン */
    .btn-review { background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%); }
    .btn-review:hover { background:linear-gradient(135deg,#d97fe0 0%,#d84560 100%); box-shadow:0 4px 12px rgba(245,87,108,.4); }
    .review-badge { display:inline-block; background:#fff; color:#f5576c; border-radius:12px; font-size:.75em; font-weight:700; padding:2px 8px; margin-left:8px; vertical-align:middle; }

    /* おさらい確認画面 */
    .review-word-list { margin:16px 0; max-height:380px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
    .review-word-card { background:linear-gradient(135deg,#fdf4ff 0%,#fce4ec 100%); border:1.5px solid #f8bbd0; border-left:4px solid #f5576c; border-radius:10px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:.98em; }
    .review-word-card-en { font-weight:700; color:#b71c1c; }
    .review-word-card-ja { color:#555; text-align:right; }
    .review-clear-btn { background:#ff6b6b !important; }
    .review-clear-btn:hover { background:#ee5a52 !important; box-shadow:0 4px 12px rgba(255,107,107,.4) !important; }

    /* 設定画面 */
    .practice-settings-section { background:#f8f9fa; border-radius:10px; padding:14px 16px; margin:12px 0; }
    .practice-settings-label { font-size:.9em; color:#888; font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; text-align:center; }
    .direction-selector { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:16px 0; }
    .direction-btn { padding:10px 18px; border:2px solid #ccc; border-radius:24px; background:#f5f5f5; color:#666; font-size:.95em; font-weight:600; cursor:pointer; transition:all .2s ease; margin:4px; }
    .direction-btn:hover { border-color:#667eea; background:#eef0fd; color:#667eea; transform:translateY(-1px); box-shadow:none; }
    .direction-btn.selected { border-color:#667eea; background:#667eea; color:white; box-shadow:0 3px 10px rgba(102,126,234,.35); }

    /* 結果画面 */
    .result-section { margin-top:28px; }
    .result-header { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px; }
    .result-header-icon { font-size:1.4em; }
    .result-title { font-size:1.15em; font-weight:700; color:#c62828; }
    .result-count-badge { background:#c62828; color:white; border-radius:20px; padding:2px 10px; font-size:.85em; font-weight:700; }
    .incorrect-cards { display:flex; flex-direction:column; gap:10px; }
    .incorrect-card { background:linear-gradient(135deg,#fff5f5 0%,#fff0f0 100%); border:1.5px solid #ffcdd2; border-left:4px solid #e53935; border-radius:10px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; animation:slideIn .3s ease forwards; opacity:0; }
    @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .incorrect-card-word { font-size:1.05em; font-weight:700; color:#c62828; }
    .incorrect-card-meaning { font-size:1em; color:#555; text-align:right; }
    .incorrect-card-divider { color:#ccc; font-size:1.1em; }

    .score-summary { background:linear-gradient(135deg,#e8f5e9,#f1f8e9); border:1.5px solid #a5d6a7; border-radius:12px; padding:18px; text-align:center; margin:20px 0 0; }
    .score-summary.score-bad { background:linear-gradient(135deg,#fff3e0,#fff8e1); border-color:#ffcc80; }
    .score-summary-label { font-size:.95em; color:#777; margin-bottom:6px; }
    .score-summary-value { font-size:2.2em; font-weight:800; color:#2e7d32; }
    .score-summary.score-bad .score-summary-value { color:#e65100; }
    .score-summary-sub { font-size:.9em; color:#888; margin-top:4px; }

    #statsContent .score-summary { font-size:1.1em; line-height:2; }

    /* セッションおさらいボタン */
    .btn-session-review { background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%); font-size:1.05em; padding:13px 28px; }
    .btn-session-review:hover { background:linear-gradient(135deg,#d97fe0 0%,#d84560 100%); box-shadow:0 4px 12px rgba(245,87,108,.4); }

    @media(max-width:600px) {
      .container{padding:20px 15px} h1{font-size:1.5em} h2{font-size:1.2em}
      .word,.question{font-size:1.6em} button{padding:10px 20px;font-size:.95em}
      .section-list{max-height:1200px}
      .incorrect-card{flex-direction:column;align-items:flex-start;gap:4px}
      .incorrect-card-meaning{text-align:left}
    }
  </style>
  <script src="words.js"></script>
</head>
<body>

  <!-- モード選択画面 -->
  <div id="modeMenu" class="container">
    <h1>英単語学習</h1>
    <h2>モードを選択してください</h2>
    <div class="menu">
      <button onclick="chooseMode('memorize')">暗記モード</button>
      <button onclick="chooseMode('practice')">実践モード</button>
      <br>
      <button class="btn-review" onclick="chooseMode('review')">
        おさらいモード <span class="review-badge" id="reviewBadge">0</span>
      </button>
      <button onclick="chooseMode('stats')">統計データ</button>
    </div>
  </div>

  <!-- レベル選択画面 -->
  <div id="levelMenu" class="container hidden">
    <h2 id="levelModeTitle"></h2>
    <h3>レベルを選択してください</h3>
    <div class="menu" id="levelListMenu"></div>
    <div class="button-group">
      <button onclick="backToModeMenu()">モード選択に戻る</button>
    </div>
  </div>

  <!-- セクション選択画面 -->
  <div id="sectionMenu" class="container hidden">
    <h2 id="selectedModeTitle"></h2>
    <h3>セクションを選択してください（複数可）</h3>
    <div id="sectionList"></div>
    <div class="button-group">
      <button onclick="startSelectedMode()">スタート</button><br>
      <button onclick="selectAllSections()">すべて選択</button>
      <button onclick="clearAllSelections()" class="redButton">選択を全削除</button><br>
      <button onclick="backToLevelMenu()">レベル選択に戻る</button>
    </div>
  </div>

  <!-- 暗記モード画面 -->
  <div id="memorizeMenu" class="container hidden">
    <h2>暗記モード</h2>
    <div class="word" id="memorizeWord"></div>
    <div class="button-group">
      <button id="backButton" onclick="backMemorize()">前へ</button>
      <button id="nextButton" onclick="nextMemorize()">次へ</button>
      <br>
      <button onclick="backToSectionMenu()">セクション選択に戻る</button>
    </div>
  </div>

  <!-- おさらいモード確認画面 -->
  <div id="reviewConfirmMenu" class="container hidden">
    <h2>おさらいモード</h2>
    <h3>📚 保存された間違い単語 <span id="reviewWordList_num"></span></h3>
    <div class="review-word-list" id="reviewWordList"></div>
    <div class="button-group">
      <button class="btn-review" onclick="startReviewPractice()">おさらいスタート</button>
      <br>
      <button class="review-clear-btn" onclick="clearReviewWords()">リストをクリア</button>
      <br>
      <button onclick="backToModeMenu()">モード選択に戻る</button>
    </div>
  </div>

  <!-- 統計データ画面 -->
  <div id="statsMenu" class="container hidden">
    <h2>統計データ</h2>
    <div id="statsContent"></div>
    <div class="button-group">
      <button onclick="backToModeMenu()">モード選択に戻る</button>
    </div>
  </div>

  <!-- 実践モード設定画面 -->
  <div id="practiceMenu" class="container hidden">
    <h2 id="practiceMenuTitle">実践モード設定</h2>
    <div class="practice-settings-section">
      <div class="practice-settings-label">問題形式</div>
      <div class="direction-selector">
        <button class="direction-btn" id="dirBtn-word"    onclick="setDirection('word')">英語 → 日本語</button>
        <button class="direction-btn" id="dirBtn-meaning" onclick="setDirection('meaning')">日本語 → 英語</button>
        <button class="direction-btn selected" id="dirBtn-both" onclick="setDirection('both')">両方</button>
      </div>
    </div>
    <div class="practice-settings-section">
      <div class="practice-settings-label">順番</div>
      <div class="checkbox-container" style="margin:8px 0">
        <label><input type="checkbox" id="shuffleOption"> シャッフルする</label>
      </div>
    </div>
    <div class="button-group">
      <button onclick="startPractice()">スタート</button>
      <br>
      <button id="practiceMenuBackBtn" onclick="backFromPracticeMenu()">セクション選択に戻る</button>
    </div>
  </div>

  <!-- 実践問題画面 -->
  <div id="practiceQuestion" class="container hidden">
    <div class="question" id="questionWord"></div>
    <div class="score">
      正解数: <span id="correctCount">0</span>問<br>
      <span id="currentQuestionIndex">0</span> / <span id="totalCount">0</span>
    </div>
    <div class="choices" id="choices"></div>
    <div class="answer-feedback" id="answerFeedback"></div>
    <div id="scoreSummary" class="hidden"></div>
    <div id="incorrectSection" class="result-section hidden"></div>
    <div class="button-group">
      <button id="nextQuestion" onclick="nextQuestion()">次へ</button>
      <br>
      <!-- 結果画面でのみ表示（セッションおさらー中は非表示） -->
      <button id="reviewButton" class="btn-session-review hidden" onclick="goReviewPractice()">
        📝 この問題だけおさらいする
      </button>
      <br>
      <button id="backFromQuestionBtn" onclick="backFromQuestion()">メニューに戻る</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'vocabmaster_incorrect_words';
  const STATS_KEY   = 'vocabmaster_stats';
  const levelCount  = 19;

  function loadIncorrectWords() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch(e) { return []; }
  }

  function saveIncorrectWords(list) {
    try {
      const seen = new Set();
      const unique = list.filter(w => {
        const k = w.word + '||' + w.meaning;
        return seen.has(k) ? false : (seen.add(k), true);
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(unique));
      updateReviewBadge();
      return unique;
    } catch(e) { return list; }
  }

  function removeFromIncorrectWords(wordObj) {
    const list = loadIncorrectWords();
    const filtered = list.filter(w => !(w.word === wordObj.word && w.meaning === wordObj.meaning));
    if (filtered.length !== list.length) saveIncorrectWords(filtered);
  }

  function updateReviewBadge() {
    document.getElementById('reviewBadge').textContent = loadIncorrectWords().length;
  }

  function loadStats() {
    try { return JSON.parse(localStorage.getItem(STATS_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function saveStats(s) { localStorage.setItem(STATS_KEY, JSON.stringify(s)); }
  function getStats() {
    return Object.assign({ totalAnswered:0, correct:0, incorrect:0, memorized:0, totalStudyTime:0 }, loadStats());
  }

  let selectedMode          = '';
  let selectedLevel         = 0;
  let selectedSections      = [];
  let filteredWords         = [];
  let originalFilteredWords = [];
  let memorizeIndex         = 0;
  let memorizeStage         = 'word';
  let correctCount          = 0;
  let totalCount            = 0;
  let levelSections         = [];
  let sectionSelections     = {};
  let sub_incorrectWords    = [];
  let isReviewMode          = false;
  let isSessionReview       = false;
  let questionDirection     = 'both';
  let studyStartTime        = null;

  let practiceWords        = [];
  let currentQuestionIndex = 0;
  let currentCorrectAnswer = '';
  let currentQuestionType  = 'word';

  function setDirection(dir) {
    questionDirection = dir;
    ['word','meaning','both'].forEach(d =>
      document.getElementById('dirBtn-' + d).classList.toggle('selected', d === dir)
    );
  }

  function setAnswerFeedback(msg, isCorrect) {
    const el = document.getElementById('answerFeedback');
    el.textContent = msg;
    el.style.color = isCorrect ? '#2d6a2d' : '#c62828';
  }

  function flushStudyTime() {
    if (!studyStartTime) return;
    const s = getStats();
    s.totalStudyTime += Math.floor((Date.now() - studyStartTime) / 1000);
    saveStats(s);
    studyStartTime = null;
  }

  function getLevelSections(level) {
    const ranges = {
      1:[1,3],2:[4,6],3:[7,9],4:[10,12],5:[13,15],6:[16,18],
      7:[19,21],8:[22,24],9:[25,27],10:[28,30],11:[31,33],12:[34,36],
      13:[37,39],14:[40,42],15:[43,45],16:[46,48],17:[49,51],18:[52,54],19:[55,57]
    };
    const [s,e] = ranges[level];
    return Object.keys(sectionNames).map(Number).filter(n => n >= s && n <= e).sort((a,b) => a-b);
  }

  function getSectionPage(sec) {
    const w = words.find(w => w.section === sec);
    return w ? w.page : '';
  }

  function generate_SectionList() {
    const el = document.getElementById('sectionList');
    el.innerHTML = '';
    levelSections.forEach(sec => {
      const p = getSectionPage(sec);
      const div = document.createElement('div');
      div.className = 'section-item';
      div.innerHTML = '<label><input type="checkbox" value="' + sec + '" ' + (sectionSelections[sec]?'checked':'') + '> ' + sectionNames[sec] + (p?' (p'+p+')':'') + '</label>';
      el.appendChild(div);
    });
    el.querySelectorAll('input[type="checkbox"]').forEach(inp => {
      inp.addEventListener('change', e => { sectionSelections[parseInt(e.target.value)] = e.target.checked; });
    });
  }

  function generate_levelList() {
    const menu = document.getElementById('levelListMenu');
    menu.innerHTML = '';
    for (let i = 1; i <= levelCount; i++) {
      const btn = document.createElement('button');
      btn.textContent = 'Level ' + i;
      btn.onclick = (lvl => () => chooseLevel(lvl))(i);
      menu.appendChild(btn);
      if (i % 2 === 0) menu.appendChild(document.createElement('br'));
    }
  }

  function chooseMode(mode) {
    selectedMode    = mode;
    isReviewMode    = (mode === 'review');
    isSessionReview = false;

    document.getElementById('modeMenu').classList.add('hidden');

    if (mode === 'review') {
      const saved = loadIncorrectWords();
      if (!saved.length) {
        alert('おさらいする単語がありません。\n実践モードで問題を解いて間違えた単語を貯めましょう！');
        document.getElementById('modeMenu').classList.remove('hidden');
        return;
      }
      filteredWords = saved;
      showReviewConfirm(saved);
      return;
    }
    if (mode === 'stats') {
      showStats();
      document.getElementById('statsMenu').classList.remove('hidden');
      return;
    }

    document.getElementById('levelMenu').classList.remove('hidden');
    document.getElementById('levelModeTitle').textContent =
      mode === 'memorize' ? '暗記モード - レベル選択' : '実践モード - レベル選択';
    generate_levelList();
  }

  function showStats() {
    const s = getStats();
    const pct = s.totalAnswered ? Math.round(s.correct / s.totalAnswered * 100) : 0;
    document.getElementById('statsContent').innerHTML =
      '<div class="score-summary ' + (pct < 50 ? 'score-bad' : '') + '">' +
      '総回答数：' + s.totalAnswered + ' 回<br>' +
      '正解した回数：' + s.correct + ' 回<br>' +
      '間違えた回数：' + s.incorrect + ' 回<br>' +
      '暗記した単語数：' + s.memorized + ' 個<br><br>' +
      '総学習時間：' + formatTime(s.totalStudyTime) +
      '</div>';
  }

  function formatTime(sec) {
    return Math.floor(sec/3600) + '時間 ' + Math.floor((sec%3600)/60) + '分 ' + (sec%60) + '秒';
  }

  function showReviewConfirm(savedWords) {
    const el = document.getElementById('reviewWordList');
    el.innerHTML = '';
    savedWords.forEach(w => {
      const card = document.createElement('div');
      card.className = 'review-word-card';
      card.innerHTML =
        '<span class="review-word-card-en">' + w.word + '</span>' +
        '<span style="color:#ccc">→</span>' +
        '<span class="review-word-card-ja">' + w.meaning + '</span>';
      el.appendChild(card);
    });
    document.getElementById('reviewWordList_num').textContent = '(' + savedWords.length + '語)';
    document.getElementById('reviewConfirmMenu').classList.remove('hidden');
  }

  function startReviewPractice() {
    document.getElementById('reviewConfirmMenu').classList.add('hidden');
    document.getElementById('practiceMenuTitle').textContent = 'おさらいモード設定';
    document.getElementById('practiceMenuBackBtn').textContent = 'おさらい確認に戻る';
    document.getElementById('practiceMenu').classList.remove('hidden');
  }

  function clearReviewWords() {
    if (!confirm('保存された間違い単語をすべて削除しますか？')) return;
    saveIncorrectWords([]);
    document.getElementById('reviewConfirmMenu').classList.add('hidden');
    document.getElementById('modeMenu').classList.remove('hidden');
    updateReviewBadge();
  }

  function chooseLevel(level) {
    selectedLevel  = level;
    levelSections  = getLevelSections(level);
    document.getElementById('levelMenu').classList.add('hidden');
    document.getElementById('sectionMenu').classList.remove('hidden');
    document.getElementById('selectedModeTitle').textContent =
      selectedMode === 'memorize'
        ? '暗記モード - Level ' + level + ' セクション選択'
        : '実践モード - Level ' + level + ' セクション選択';
    generate_SectionList();
  }

  function clearAllSelections() { sectionSelections = {}; generate_SectionList(); }
  function selectAllSections()  { sectionSelections = {}; levelSections.forEach(s => { sectionSelections[s] = true; }); generate_SectionList(); }

  function backToModeMenu() {
    ['levelMenu','sectionMenu','memorizeMenu','practiceMenu',
     'practiceQuestion','reviewConfirmMenu','statsMenu'].forEach(id =>
      document.getElementById(id).classList.add('hidden')
    );
    document.getElementById('modeMenu').classList.remove('hidden');
    sectionSelections = {};
    document.body.className = '';
    flushStudyTime();
    updateReviewBadge();
  }

  function backToLevelMenu() {
    document.getElementById('sectionMenu').classList.add('hidden');
    document.getElementById('levelMenu').classList.remove('hidden');
    sectionSelections = {};
    generate_levelList();
  }

  function backToSectionMenu() {
    ['memorizeMenu','practiceMenu','practiceQuestion'].forEach(id =>
      document.getElementById(id).classList.add('hidden')
    );
    document.getElementById('sectionMenu').classList.remove('hidden');
    memorizeIndex = 0; memorizeStage = 'word';
    generate_SectionList();
    document.body.className = '';
  }

  function backFromPracticeMenu() {
    // 設定画面に戻る際も念のためフラッシュ（通常は0秒だが安全のため）
    flushStudyTime();
    document.getElementById('practiceMenu').classList.add('hidden');
    if (isSessionReview) {
      isSessionReview = false;
      isReviewMode    = false;
      filteredWords   = originalFilteredWords.slice();
      document.getElementById('practiceMenuTitle').textContent = '実践モード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'セクション選択に戻る';
      document.getElementById('sectionMenu').classList.remove('hidden');
    } else if (isReviewMode) {
      const saved = loadIncorrectWords();
      if (saved.length) {
        showReviewConfirm(saved);
      } else {
        document.getElementById('modeMenu').classList.remove('hidden');
        updateReviewBadge();
      }
    } else {
      document.getElementById('sectionMenu').classList.remove('hidden');
    }
  }

  function backFromQuestion() {
    // ★ 中断時：経過時間と間違い単語を保存
    flushStudyTime();
    saveCurrentIncorrectWords();

    document.getElementById('practiceQuestion').classList.add('hidden');
    document.getElementById('reviewButton').classList.add('hidden');
    document.body.className = '';

    if (isSessionReview) {
      isSessionReview = false;
      isReviewMode    = false;
      filteredWords   = originalFilteredWords.slice();
      document.getElementById('practiceMenuTitle').textContent = '実践モード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'セクション選択に戻る';
    } else if (isReviewMode) {
      document.getElementById('practiceMenuTitle').textContent = 'おさらいモード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'おさらい確認に戻る';
    } else {
      document.getElementById('practiceMenuTitle').textContent = '実践モード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'セクション選択に戻る';
    }
    document.getElementById('practiceMenu').classList.remove('hidden');
  }

  function getSelectedSections() {
    return Object.keys(sectionSelections).filter(s => sectionSelections[s]).map(Number);
  }

  function startSelectedMode() {
    selectedSections = getSelectedSections();
    if (!selectedSections.length) { alert('セクションを選択してください'); return; }
    filteredWords = words.filter(w => selectedSections.includes(w.section));
    if (selectedMode === 'memorize') {
      startMemorize();
    } else {
      document.getElementById('sectionMenu').classList.add('hidden');
      document.getElementById('practiceMenuTitle').textContent = '実践モード設定';
      document.getElementById('practiceMenuBackBtn').textContent = 'セクション選択に戻る';
      document.getElementById('practiceMenu').classList.remove('hidden');
    }
  }

  function startMemorize() {
    studyStartTime = Date.now();
    document.getElementById('sectionMenu').classList.add('hidden');
    document.getElementById('memorizeMenu').classList.remove('hidden');
    memorizeIndex = 0; memorizeStage = 'word';
    document.getElementById('nextButton').disabled = false;
    showMemorize();
  }

  function showMemorize() {
    if (memorizeIndex >= filteredWords.length) {
      document.getElementById('memorizeWord').innerHTML = 'お疲れさまでした！';
      document.getElementById('nextButton').disabled = true;
      flushStudyTime();
      return;
    }
    document.getElementById('nextButton').disabled = false;
    const cur = filteredWords[memorizeIndex];
    const s = getStats(); s.memorized++; saveStats(s);
    document.getElementById('memorizeWord').innerHTML =
      memorizeStage === 'word' ? cur.word : cur.meaning;
  }

  function nextMemorize() {
    if (memorizeStage === 'word') { memorizeStage = 'meaning'; }
    else { memorizeStage = 'word'; memorizeIndex++; }
    showMemorize();
  }

  function backMemorize() {
    if (memorizeStage === 'meaning') { memorizeStage = 'word'; }
    else if (memorizeIndex > 0) { memorizeIndex--; memorizeStage = 'meaning'; }
    showMemorize();
  }

  function buildPracticeWords(wordList) {
    const arr = [];
    if (questionDirection === 'word'    || questionDirection === 'both') wordList.forEach(w => arr.push(Object.assign({}, w, {questionType:'word'})));
    if (questionDirection === 'meaning' || questionDirection === 'both') wordList.forEach(w => arr.push(Object.assign({}, w, {questionType:'meaning'})));
    return arr;
  }

  function launchPractice(wordList, shuffle) {
    sub_incorrectWords   = [];
    practiceWords        = buildPracticeWords(wordList);
    if (shuffle) practiceWords.sort(() => Math.random() - 0.5);

    currentQuestionIndex = 0;
    correctCount         = 0;
    totalCount           = practiceWords.length;
    studyStartTime       = Date.now();

    document.getElementById('practiceMenu').classList.add('hidden');
    document.getElementById('practiceQuestion').classList.remove('hidden');
    document.getElementById('scoreSummary').classList.add('hidden');
    document.getElementById('incorrectSection').classList.add('hidden');
    document.getElementById('reviewButton').classList.add('hidden');
    document.getElementById('correctCount').textContent = 0;
    document.getElementById('totalCount').textContent   = totalCount;
    document.getElementById('nextQuestion').disabled    = true;
    document.getElementById('currentQuestionIndex').textContent = 1;
    document.getElementById('questionWord').innerHTML = '';
    document.getElementById('choices').innerHTML = '';
    setAnswerFeedback('', false);
    document.body.className = '';
    showPracticeQuestion();
  }

  function startPractice() {
    if (isReviewMode && !isSessionReview) filteredWords = loadIncorrectWords();
    launchPractice(filteredWords, document.getElementById('shuffleOption').checked);
  }

  function goReviewPractice() {
    if (!sub_incorrectWords.length) return;

    const seen = new Set();
    const sessionWords = sub_incorrectWords.filter(w => {
      const k = w.word + '||' + w.meaning;
      return seen.has(k) ? false : (seen.add(k), true);
    });

    if (!isSessionReview) {
      originalFilteredWords = filteredWords.slice();
    }

    isSessionReview = true;
    isReviewMode    = false;
    filteredWords   = sessionWords;

    document.getElementById('practiceQuestion').classList.add('hidden');
    document.getElementById('reviewButton').classList.add('hidden');
    document.getElementById('practiceMenuTitle').textContent = 'おさらい設定（今回の間違い ' + sessionWords.length + '語）';
    document.getElementById('practiceMenuBackBtn').textContent = '結果に戻る';
    document.getElementById('practiceMenu').classList.remove('hidden');
    document.body.className = '';
  }

  function showPracticeQuestion() {
    if (currentQuestionIndex >= practiceWords.length) {
      document.getElementById('questionWord').innerHTML = '全問終了！';
      document.getElementById('choices').innerHTML = '';
      setAnswerFeedback('', false);
      document.getElementById('nextQuestion').disabled = true;
      flushStudyTime();

      // スコアサマリー
      const pct       = Math.round(correctCount / totalCount * 100);
      const summaryEl = document.getElementById('scoreSummary');
      summaryEl.className = (pct >= 70) ? 'score-summary' : 'score-summary score-bad';
      summaryEl.innerHTML =
        '<div class="score-summary-label">最終スコア</div>' +
        '<div class="score-summary-value">' + correctCount + ' <span style="font-size:.55em;font-weight:500">/ ' + totalCount + '</span></div>' +
        '<div class="score-summary-sub">正答率 ' + pct + '%</div>';
      summaryEl.classList.remove('hidden');

      if (sub_incorrectWords.length > 0) {
        if (isReviewMode) {
          saveIncorrectWords(sub_incorrectWords);
        } else {
          saveIncorrectWords(loadIncorrectWords().concat(sub_incorrectWords));
        }

        const sectionEl = document.getElementById('incorrectSection');
        sectionEl.innerHTML =
          '<div class="result-header">' +
            '<span class="result-header-icon">📝</span>' +
            '<span class="result-title">間違えた単語</span>' +
            '<span class="result-count-badge">' + sub_incorrectWords.length + '語</span>' +
          '</div>' +
          '<div class="incorrect-cards" id="incorrectCardList"></div>';
        sectionEl.classList.remove('hidden');

        const cardList = document.getElementById('incorrectCardList');
        sub_incorrectWords.forEach(function(w, i) {
          const card = document.createElement('div');
          card.className = 'incorrect-card';
          card.style.animationDelay = (i * 60) + 'ms';
          card.innerHTML =
            '<span class="incorrect-card-word">' + w.word + '</span>' +
            '<span class="incorrect-card-divider">→</span>' +
            '<span class="incorrect-card-meaning">' + w.meaning + '</span>';
          cardList.appendChild(card);
        });

        document.getElementById('reviewButton').classList.remove('hidden');
      } else {
        const sectionEl = document.getElementById('incorrectSection');
        sectionEl.innerHTML =
          '<div class="result-header">' +
            '<span class="result-header-icon">🎉</span>' +
            '<span class="result-title" style="color:#2e7d32">Congratulations! You got them all right!</span>' +
          '</div>';
        sectionEl.classList.remove('hidden');
      }
      return;
    }

    const current           = practiceWords[currentQuestionIndex];
    currentQuestionType     = current.questionType;

    let questionText, correctAnswer, allChoices;
    if (currentQuestionType === 'word') {
      questionText  = current.word;
      correctAnswer = current.meaning;
      allChoices    = words.map(function(w){ return w.meaning; });
    } else {
      questionText  = current.meaning;
      correctAnswer = current.word;
      allChoices    = words.map(function(w){ return w.word; });
    }

    currentCorrectAnswer = correctAnswer;
    document.getElementById('questionWord').innerHTML = questionText;

    var options = [correctAnswer];
    while (options.length < 4) {
      var r = allChoices[Math.floor(Math.random() * allChoices.length)];
      if (!options.includes(r)) options.push(r);
    }
    options.sort(() => Math.random() - 0.5);

    const choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';
    options.forEach(function(opt) {
      const btn = document.createElement('button');
      btn.textContent = opt;
      btn.onclick = function() {
        Array.from(choicesDiv.children).forEach(function(b) {
          b.disabled = true;
          if (b.textContent === correctAnswer) b.classList.add('correct-answer');
        });

        const s = getStats();
        s.totalAnswered++;
        if (opt === correctAnswer) {
          s.correct++;
          setAnswerFeedback('正解！', true);
          document.body.className = 'correct-bg';
          correctCount++;
          document.getElementById('correctCount').textContent = correctCount;
          removeFromIncorrectWords(current);
        } else {
          s.incorrect++;
          setAnswerFeedback('不正解！正解は：' + correctAnswer, false);
          sub_incorrectWords.push(current);
          document.body.className = 'incorrect-bg';
        }
        saveStats(s);
        document.getElementById('nextQuestion').disabled = false;
      };
      choicesDiv.appendChild(btn);
    });
  }

  function nextQuestion() {
    document.body.className = '';
    currentQuestionIndex++;
    setAnswerFeedback('', false);
    document.getElementById('nextQuestion').disabled = true;
    if (currentQuestionIndex < totalCount) {
      document.getElementById('currentQuestionIndex').textContent = currentQuestionIndex + 1;
    }
    showPracticeQuestion();
  }

  updateReviewBadge();
</script>

</body>
